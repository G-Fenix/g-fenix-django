services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: gfenix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gfenix2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: gfenix/gfenix:latest
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PASSWORD=gfenix2024
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
